[platformio]
default_envs = esp32dev

[env]
lib_deps =
  bblanchon/ArduinoJson@7.4.3

[env:esp32dev]
platform = platformio/espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  ${env.lib_deps}
  links2004/WebSockets@2.7.3
  tzapu/WiFiManager@2.0.17

# Wokwi simulation build only: skips the captive portal and bakes in the
# Wokwi-GUEST WiFi plus gateway settings. Never flash this to real hardware.
[env:esp32dev-wokwi]
extends = env:esp32dev
build_flags =
  -D SIM_WOKWI
  -D SIM_WOKWI_HOST='"host.wokwi.internal"'
  -D SIM_WOKWI_PORT=8081
  -D SIM_WOKWI_SOURCE='"sim-source"'

# Host build of lib/tally for the Unity tests; src/ is firmware glue only.
[env:native]
platform = platformio/native@1.2.1
test_framework = unity
build_flags = -std=c++17
